name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  patch-check:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: dnf -y install patch curl tar jq
      - name: Series applies cleanly to the pinned base
        run: |
          set -euo pipefail
          commit=$(jq -r .base.commit sources.json)
          curl -fsSL "https://gitlab.com/Remmina/Remmina/-/archive/${commit}/Remmina-${commit}.tar.gz" -o base.tgz
          tar xf base.tgz
          cd "Remmina-${commit}"
          for p in ../patches/00*.patch; do
            echo "applying $(basename "$p")"; patch -p1 < "$p"
          done
          echo "OK: all patches apply to ${commit}"

  plugin-rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install build tooling
        run: dnf -y install rpm-build rpmdevtools 'dnf-command(builddep)'
      - name: Build plugin SRPM
        run: scripts/make-srpm.sh rpm/remmina-plugins-rdp-avd.spec out/
      - name: Install BuildRequires
        run: dnf -y builddep out/remmina-plugins-rdp-avd-*.src.rpm
      - name: Rebuild plugin RPM (runs %check: linkage + smart-card strings)
        run: rpmbuild --rebuild out/remmina-plugins-rdp-avd-*.src.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-rpm
          path: ~/rpmbuild/RPMS/*/remmina-plugin-rdp-*.rpm
          if-no-files-found: warn

  base-rpm:
    # Heavier full-Remmina build — on demand / nightly, not every PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install build tooling
        run: dnf -y install rpm-build rpmdevtools 'dnf-command(builddep)'
      - name: Build base SRPM
        run: scripts/make-srpm.sh rpm/remmina.spec out/
      - name: Install BuildRequires
        run: dnf -y builddep out/remmina-*.src.rpm
      - name: Rebuild base RPMs
        run: rpmbuild --rebuild out/remmina-*.src.rpm
